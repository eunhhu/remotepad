name: RemotePad
options:
  bundleIdPrefix: com.eunhhu
  deploymentTarget:
    iOS: "17.0"
targets:
  RemotePad:
    type: application
    platform: iOS
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: RemotePad
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: RemotePad connects to your local RemotePad server for layout sync and UDP input.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - Sources
      - path: ../RemotePadClient/Sources/RemotePadClient
        group: RemotePadClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eunhhu.remotepad
        DEVELOPMENT_TEAM: FGS77772YC
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        MARKETING_VERSION: 0.2.3
        CURRENT_PROJECT_VERSION: 4
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  RemotePad:
    build:
      targets:
        RemotePad: all
    run:
      config: Debug
    archive:
      config: Release
