[package]
name = "remotepad"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "ISC"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "remotepad"
path = "src/main.rs"

[[bin]]
name = "remotepad-qa"
path = "src/bin/remotepad-qa.rs"
